name: Release macOS build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: Podstash.xcodeproj
  SCHEME: Podstash
  TEAM_ID: 8F5SLDK3C7
  PROVISIONING_PROFILE_UUID: d3ccd346-172e-4a17-9b7b-fbba3a0ac8e4

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/podstash-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/[" ]//g')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$MACOS_PROVISIONING_PROFILE" | base64 --decode -o "$PROFILE_DIR/$PROVISIONING_PROFILE_UUID.provisionprofile"

      - name: Register AppleScript dictionary stub
        run: |
          set -euo pipefail
          # The "Compile AppleScript Resources" build phase compiles scripts that
          # reference `tell application id "me.geoffoliver.Podstash"` using custom
          # terminology from Podstash.sdef. osacompile resolves that dictionary via
          # Launch Services, which requires *some* app with that bundle ID to be
          # registered. On a dev machine that's satisfied by earlier local builds;
          # on a clean runner nothing is registered, so register a minimal stub.
          STUB="$RUNNER_TEMP/PodstashDictionaryStub.app"
          mkdir -p "$STUB/Contents/MacOS" "$STUB/Contents/Resources"
          cp "Podstash/Podstash.sdef" "$STUB/Contents/Resources/Podstash.sdef"
          printf '#!/bin/sh\nexit 0\n' > "$STUB/Contents/MacOS/Podstash"
          chmod +x "$STUB/Contents/MacOS/Podstash"
          cat > "$STUB/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Podstash</string>
              <key>CFBundleIdentifier</key>
              <string>me.geoffoliver.Podstash</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSAppleScriptEnabled</key>
              <true/>
              <key>OSAScriptingDefinition</key>
              <string>Podstash.sdef</string>
          </dict>
          </plist>
          PLIST

          /System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/LaunchServices.framework/Versions/A/Support/lsregister -f "$STUB"

      - name: Archive (signed with Developer ID)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/macOS.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export archive
        run: |
          set -euo pipefail
          # Exporting (rather than using the raw .app from inside the .xcarchive) matters
          # specifically because of Sparkle: per its docs, Xcode only re-signs Sparkle.framework's
          # nested helpers (Autoupdate, Updater.app, XPCServices) with our Developer ID identity
          # during Archive & Export, not during a plain archive. Skipping export leaves those
          # nested binaries signed with Sparkle's own ad-hoc signature, which notarization rejects.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>me.geoffoliver.Podstash</key>
                  <string>$PROVISIONING_PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/macOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          MAC_APP="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.app" | head -n 1)"
          NOTARIZE_ZIP="$RUNNER_TEMP/Podstash-notarize.zip"

          ditto -c -k --keepParent "$MAC_APP" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait

          xcrun stapler staple "$MAC_APP"

          mkdir -p dist
          ditto -c -k --keepParent "$MAC_APP" "dist/Podstash.app.zip"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Podstash-macOS
          path: dist/Podstash.app.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            dist/Podstash.app.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "macOS build below is a universal binary (Apple Silicon & Intel), Developer ID signed and notarized — no Gatekeeper warnings. Unzip and drag Podstash.app to /Applications."

      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SPARKLE_VERSION="2.9.5"
          TOOLS_DIR="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$TOOLS_DIR"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/Sparkle-tools.tar.xz"
          tar -xJf "$RUNNER_TEMP/Sparkle-tools.tar.xz" -C "$TOOLS_DIR" bin/generate_appcast

          WORKDIR="$RUNNER_TEMP/appcast-workdir"
          mkdir -p "$WORKDIR"

          # Reuse prior releases' entries rather than starting from scratch each time.
          if [ -f docs/appcast.xml ]; then
            cp docs/appcast.xml "$WORKDIR/appcast.xml"
          fi

          cp dist/Podstash.app.zip "$WORKDIR/Podstash.app.zip"

          # Release notes file shares the archive's basename (minus .zip) so
          # generate_appcast picks it up and embeds it in the new appcast item.
          gh release view "${{ github.ref_name }}" --json body -q .body > "$WORKDIR/Podstash.app.md"

          echo "$SPARKLE_PRIVATE_KEY" | "$TOOLS_DIR/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            --link "https://geoffoliver.github.io/podstash/" \
            --embed-release-notes \
            "$WORKDIR"

      - name: Publish updated appcast to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          mkdir -p docs
          cp "$RUNNER_TEMP/appcast-workdir/appcast.xml" docs/appcast.xml
          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update appcast.xml for ${{ github.ref_name }}"
          git push origin master
